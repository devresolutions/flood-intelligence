name: Collect Live Flood Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/live-snapshots
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe official sources and build snapshot
        env:
          WINDY_POINT_FORECAST_API_KEY: ${{ secrets.WINDY_POINT_FORECAST_API_KEY }}
        run: node scripts/collect-live-data.mjs
      - name: Commit changed snapshot
        run: |
          git config user.name "flood-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/latest.json
          git diff --cached --quiet || git commit -m "data: refresh official source health"
          git push origin HEAD:data/live-snapshots
