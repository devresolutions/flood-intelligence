name: Collect Live Flood Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout collector source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect official sources and Windy forecast
        env:
          WINDY_POINT_FORECAST_API_KEY: ${{ secrets.WINDY_POINT_FORECAST_API_KEY }}
        run: node scripts/collect-live-data.mjs

      - name: Publish latest snapshot to data branch
        run: |
          cp public/data/latest.json /tmp/latest.json
          git fetch origin data/live-snapshots || true
          if git show-ref --verify --quiet refs/remotes/origin/data/live-snapshots; then
            git checkout -B data/live-snapshots origin/data/live-snapshots
          else
            git checkout --orphan data/live-snapshots
            git rm -rf . || true
          fi
          mkdir -p public/data
          cp /tmp/latest.json public/data/latest.json
          git config user.name "flood-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/latest.json
          git diff --cached --quiet || git commit -m "data: refresh live flood snapshot"
          git push origin data/live-snapshots
